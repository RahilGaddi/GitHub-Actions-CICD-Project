
name: GitHub Action App Deploy CI/CD

on:
  workflow_dispatch:

  push:
    branches:
      - main
    paths:
      - 'Python-App/**'
      - '.github/workflows/GitHub-Action-App-Deploy-CICD.yml'

jobs:
  build:
    name: Build Python Application
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        working-directory: Python-App
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Validate Code
        working-directory: Python-App
        run: |
          python -m py_compile app.py
          echo "Code validation successful!"

  ssh-connectivity:
    name: Test Bastion and Private EC2 SSH
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Setup SSH Key
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

          test -s ~/.ssh/deploy_key || {
            echo "SSH private key is missing"
            exit 1
          }

      - name: Verify GitHub Variables
        env:
          BASTION_HOST: ${{ vars.BASTION_HOST }}
          PRIVATE_EC2_HOST: ${{ vars.PRIVATE_EC2_HOST }}
        run: |
          echo "BASTION_HOST length: ${#BASTION_HOST}"
          echo "PRIVATE_EC2_HOST length: ${#PRIVATE_EC2_HOST}"

          if [ -z "$BASTION_HOST" ]; then
            echo "BASTION_HOST is missing"
            exit 1
          fi

          if [ -z "$PRIVATE_EC2_HOST" ]; then
            echo "PRIVATE_EC2_HOST is missing"
            exit 1
          fi

          echo "Both EC2 host variables are available."

      - name: Configure SSH
        env:
          BASTION_HOST: ${{ vars.BASTION_HOST }}
          PRIVATE_EC2_HOST: ${{ vars.PRIVATE_EC2_HOST }}
        run: |
          cat >> ~/.ssh/config <<EOF
          Host bastion
            HostName $BASTION_HOST
            User ec2-user
            IdentityFile ~/.ssh/deploy_key
            StrictHostKeyChecking accept-new
            ConnectTimeout 15

          Host private-ec2
            HostName $PRIVATE_EC2_HOST
            User ec2-user
            IdentityFile ~/.ssh/deploy_key
            ProxyJump bastion
            StrictHostKeyChecking accept-new
            ConnectTimeout 15
          EOF

          chmod 600 ~/.ssh/config

      - name: Test Bastion Connection
        run: ssh bastion "hostname"

      - name: Test Private EC2 Connection
        run: ssh private-ec2 "hostname"

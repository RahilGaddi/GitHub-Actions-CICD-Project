
name: GitHub Action App Deploy CI/CD

on:
  workflow_dispatch:

  push:
    branches:
      - main
    paths:
      - 'Python-App/**'
      - '.github/workflows/GitHub-Action-App-Deploy-CICD.yml'

jobs:
  build:
    name: Build Python Application
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        working-directory: Python-App
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Validate Code
        working-directory: Python-App
        run: |
          python -m py_compile app.py
          echo "Code validation successful!"

  ssh-connectivity:
    name: Test Bastion and Private EC2 SSH
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup SSH Key
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

          test -s ~/.ssh/deploy_key || {
            echo "SSH private key is missing"
            exit 1
          }

      - name: Verify GitHub Secrets
        env:
          BASTION_HOST: ${{ secrets.BASTION_HOST }}
          PRIVATE_EC2_HOST: ${{ secrets.PRIVATE_EC2_HOST }}
        run: |
          if [ -z "$BASTION_HOST" ]; then
            echo "BASTION_HOST secret is missing"
            exit 1
          fi

          if [ -z "$PRIVATE_EC2_HOST" ]; then
            echo "PRIVATE_EC2_HOST secret is missing"
            exit 1
          fi

          echo "Both EC2 host secrets are available."

      - name: Configure SSH
        env:
          BASTION_HOST: ${{ secrets.BASTION_HOST }}
          PRIVATE_EC2_HOST: ${{ secrets.PRIVATE_EC2_HOST }}
        run: |
          cat >> ~/.ssh/config <<EOF
          Host bastion
            HostName $BASTION_HOST
            User ec2-user
            IdentityFile ~/.ssh/deploy_key
            StrictHostKeyChecking accept-new
            ConnectTimeout 15

          Host private-ec2
            HostName $PRIVATE_EC2_HOST
            User ec2-user
            IdentityFile ~/.ssh/deploy_key
            ProxyJump bastion
            StrictHostKeyChecking accept-new
            ConnectTimeout 15
          EOF

          chmod 600 ~/.ssh/config

      - name: Test Bastion Connection
        run: ssh -o ConnectTimeout=15 bastion "hostname"

      - name: Test Private EC2 Connection
        run: ssh -o ConnectTimeout=15 private-ec2 "hostname"

      - name: Install Python on Private EC2
        run: |
          ssh private-ec2 '
            sudo dnf install python3 python3-pip -y
            python3 --version
            pip3 --version
          '

  deploy:
    name: Deploy Python App to Private EC2
    runs-on: ubuntu-latest
    needs: [build, ssh-connectivity]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup SSH Key
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

      - name: Configure SSH
        env:
          BASTION_HOST: ${{ secrets.BASTION_HOST }}
          PRIVATE_EC2_HOST: ${{ secrets.PRIVATE_EC2_HOST }}
        run: |
          cat >> ~/.ssh/config <<EOF
          Host bastion
            HostName $BASTION_HOST
            User ec2-user
            IdentityFile ~/.ssh/deploy_key
            StrictHostKeyChecking accept-new

          Host private-ec2
            HostName $PRIVATE_EC2_HOST
            User ec2-user
            IdentityFile ~/.ssh/deploy_key
            ProxyJump bastion
            StrictHostKeyChecking accept-new
          EOF

          chmod 600 ~/.ssh/config

      - name: Transfer Application Files
        run: |
          ssh private-ec2 "rm -rf /tmp/python-app && mkdir -p /tmp/python-app"
          scp -r Python-App/. private-ec2:/tmp/python-app/

      - name: Install Application and Dependencies
        run: |
          ssh private-ec2 '
            sudo mkdir -p /opt/python-app
            sudo cp -r /tmp/python-app/. /opt/python-app/
            sudo chown -R ec2-user:ec2-user /opt/python-app

            cd /opt/python-app
            python3 -m venv venv
            ./venv/bin/pip install --upgrade pip
            ./venv/bin/pip install -r requirements.txt
          '

      - name: Configure Systemd Service
        run: |
          ssh private-ec2 'sudo tee /etc/systemd/system/python-app.service > /dev/null <<EOF
          [Unit]
          Description=Python Flask Application
          After=network.target

          [Service]
          User=ec2-user
          WorkingDirectory=/opt/python-app
          ExecStart=/opt/python-app/venv/bin/gunicorn --workers 2 --bind 0.0.0.0:5000 app:app
          Restart=always

          [Install]
          WantedBy=multi-user.target
          EOF
          sudo systemctl daemon-reload
          sudo systemctl enable python-app
          sudo systemctl restart python-app
          '

      - name: Install and Configure Nginx Reverse Proxy
        run: |
          ssh private-ec2 '
            sudo dnf install nginx -y

            sudo tee /etc/nginx/conf.d/default.conf > /dev/null << "EOF"
            server {
                listen 80;
                server_name _;

                location / {
                    proxy_pass http://127.0.0.1:5000;
                    proxy_set_header Host $host;
                    proxy_set_header X-Real-IP $remote_addr;
                    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                    proxy_set_header X-Forwarded-Proto $scheme;
                }
            }
            EOF

            if command -v setsebool >/dev/null 2>&1; then
              sudo setsebool -P httpd_can_network_connect 1
            fi

            sudo nginx -t
            sudo systemctl enable nginx
            sudo systemctl restart nginx

            sudo systemctl is-active nginx
          '

      - name: Verify Deployment
        run: |
          ssh private-ec2 '
            sleep 3
            echo "Checking Flask service..."
            sudo systemctl is-active python-app

            echo "Checking Nginx service..."
            sudo systemctl is-active nginx

            echo "Checking application through Nginx..."
            curl -f http://127.0.0.1/
          '

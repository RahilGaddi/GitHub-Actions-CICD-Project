name: Terraform Multi-Job CI/CD Pipeline

on: 
    workflow_dispatch:    #manual trigger for the workflow

    # push:                 #Automatic Trigger
    #     branches:
    #         - main
    #     paths:
    #         - 'Roots/**'

defaults:
        run:
            working-directory: Roots/environments/dev
jobs:
    terraform-plan:
        name: Terraform plan
        runs-on: ubuntu-latest
        env:
            AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
            AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

        steps:
            - name: Checkout Repository
              uses: actions/checkout@v4
            
            - name: Setup Terraform
              uses: hashicorp/setup-terraform@v3

            - name: Terraform init
              run: terraform init

            - name: terraform plan
              run: terraform plan -out=tfplan

            - name: upload plan file
              uses: actions/upload-artifact@v4
              with:
                name: terraform-plan
                path: Roots/environments/dev/tfplan

    terraform-apply:
        name: Terraform Apply
        runs-on: ubuntu-latest
        needs: terraform-plan
        environment: production 

        env:
            AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
            AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

        steps:
            - name: checkout Repository
              uses: actions/checkout@v4

            - name: Setup Terraform
              uses: hashicorp/setup-terraform@v3

            - name: Terraform init
              run: terraform init

            - name: Download plan file
              uses: actions/download-artifact@v4
              with:
                name: terraform-plan
                path: Roots/environments/dev

            - name: terraform apply
              run: terraform apply -auto-approve tfplan
